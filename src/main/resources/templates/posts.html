<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title th:text="${title}">Title</title>
</head>
<body>
<h1 class="text-center">Tutti i post</h1>

<div class="container">
    <div class="row">
        <div class="col-12">
            <a th:href="@{/posts/create}" class="btn btn-primary mb-3">+</a>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Title</th>
                    <th>Body</th>
                    <th>Publish Date</th>
                    <th>Author</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post:${posts}">
                    <td th:text="${post.id}"></td>
                    <td th:text="${post.title}"></td>
                    <td th:text="${post.body}"></td>
                    <td th:text="${post.publishDate}"></td>
                    <td th:text="${post.authorName}"></td>
                    <td>
                        <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-sm btn-warning">Modifica</a>
                        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">Elimina</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB6ONNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
