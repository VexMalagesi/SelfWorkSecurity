<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title th:text="${title}">Title</title>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-12 my-5 d-flex justify-content-center align-items-center">
            <span class="h1">Add a Post</span>
        </div>
        <div class="col-12 my-5">
            <form th:action="@{/posts}" th:object="${post}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Title...">
                </div>
                <div class="mb-3">
                    <label for="body" class="form-label">Body</label>
                    <textarea class="form-control" id="body" th:field="*{body}" rows="4" placeholder="Body..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="publishDate" class="form-label">Publish Date</label>
                    <input type="text" class="form-control" id="publishDate" th:field="*{publishDate}" placeholder="20260101">
                </div>
                <div class="mb-3">
                    <label for="authorId" class="form-label">Author</label>
                    <select class="form-control" id="authorId" name="authorId">
                        <option th:each="author:${authors}" th:value="${author.id}" th:text="${author.name + ' ' + author.surname}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="reset" class="btn btn-danger">Reset</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB6ONNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
