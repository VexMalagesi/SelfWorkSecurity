<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-12 col-md-9 col-lg-6 mx-auto">
            <h1 class="mb-4" th:text="${title}">Login</h1>

            <div th:if="${param.error}" class="alert alert-danger">
                Username o password errati.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Logout effettuato.
            </div>
        </div>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col-12 col-md-9 col-lg-6 mx-auto">
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="usernameLogin" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="usernameLogin">
                </div>
                <div class="mb-3">
                    <label for="passwordLogin" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="passwordLogin">
                </div>
                <div class="d-flex justify-content-evenly">
                    <button type="submit" value="Log in" class="btn btn-primary">Log In</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
